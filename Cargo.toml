[workspace]
resolver = "2"
members = [
    # tier 1 — daemon
    "crates/syntra-core",
    "crates/syntra-daemon",
    # tier 2 — clients
    "crates/syntra-app",
    "crates/syntra-ui",
    "crates/syntra-cli",
    # contracts
    "crates/syntra-api",
    "crates/syntra-proto",
    "crates/syntra-plugin-api",
    # subsystems
    "crates/syntra-input-capture",
    "crates/syntra-input-emulation",
    "crates/syntra-input-event",
    "crates/syntra-store",
    # tier 3 — plugins
    "plugins/clipboard",
    "plugins/fuse",
]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/DarkPhilosophy/syntra"
authors = ["Syntra contributors"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
uninlined_format_args = "allow"

[workspace.dependencies]
# Internal crates: single source of truth for every intra-workspace path.
# Versions are inherited from [workspace.package], so they are never restated.
syntra-api = { path = "crates/syntra-api" }
syntra-core = { path = "crates/syntra-core" }
syntra-cli = { path = "crates/syntra-cli" }
syntra-input-capture = { path = "crates/syntra-input-capture", default-features = false }
syntra-input-emulation = { path = "crates/syntra-input-emulation", default-features = false }
syntra-input-event = { path = "crates/syntra-input-event" }
syntra-plugin-api = { path = "crates/syntra-plugin-api" }
syntra-proto = { path = "crates/syntra-proto" }
syntra-store = { path = "crates/syntra-store" }
syntra-ui = { path = "crates/syntra-ui" }

# shared third-party versions
anyhow = "1.0"
base64 = "0.22"
bincode = "1.3.3"
clap = { version = "4.4.11", features = ["derive"] }
env_logger = "0.11.3"
futures = "0.3.28"
hostname = "0.4"
image = { version = "0.25", default-features = false }
libc = "0.2.148"
log = "0.4.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
sha2 = "0.10.8"
thiserror = "2.0.0"
tokio = "1.32.0"
toml = "0.8"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"
