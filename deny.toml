# cargo-deny >= 0.20; license choices mirror scripts/lib/spdx.js.
[advisories]
unmaintained = "workspace"
yanked = "warn"

[licenses]
include-dev = true
allow = [
    "MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0",
    "ISC", "Zlib", "Unlicense", "CC0-1.0", "0BSD", "Unicode-3.0", "Unicode-DFS-2016",
    "MPL-2.0", "LGPL-2.1-or-later", "LGPL-3.0", "LGPL-3.0-only", "LGPL-3.0-or-later",
    "GPL-3.0", "GPL-3.0-only", "GPL-3.0-or-later", "GPL-2.0-or-later",
    "CDLA-Permissive-2.0", "bzip2-1.0.6", "NCSA", "OFL-1.1", "Ubuntu-font-1.0",
    "LicenseRef-Slint-Royalty-free-2.0", "LicenseRef-Slint-Software-3.0", "LicenseRef-Slint-commercial",
    "Apache-2.0 WITH LLVM-exception",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
