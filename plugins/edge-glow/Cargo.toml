[package]
name = "syntra-plugin-edge-glow"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Draws a glow along the screen edge a pointer from another device came in through."

[dependencies]
syntra-plugin-api.workspace = true

[dev-dependencies]
png = "0.18"

# The windows and the graphics that draw into them are Linux-only for now. On
# other targets the glow maths, state and protocol still build and test, but no
# graphics stack is pulled in.
[target.'cfg(target_os = "linux")'.dependencies]
glow = "0.17"
glutin = { version = "0.32", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
x11rb = { version = "0.13", default-features = false }

[lints]
workspace = true
