[package]
name = "syntra-input-event"
description = "cross-platform syntra-input-event types for syntra-input-capture / syntra-input-emulation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures-core = "0.3.30"
log = "0.4.22"
num_enum = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.0"

[target.'cfg(all(unix, not(target_os="macos")))'.dependencies]
reis = { version = "0.7.0", optional = true }

[features]
default = ["libei"]
libei = ["dep:reis"]
