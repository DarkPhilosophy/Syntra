plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.syntra.syntra'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    defaultConfig {
        applicationId 'io.syntra.syntra'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main { jniLibs.srcDirs = [layout.buildDirectory.dir('generated/jniLibs')] }
    }
}

def uiCrateDir = layout.projectDirectory.dir('../..')
def generatedJni = layout.buildDirectory.dir('generated/jniLibs')

tasks.register('buildRustRelease', Exec) {
    workingDir uiCrateDir
    // Debug APKs use the incremental `fast` profile; release APKs the full
    // optimising one.
    def profile = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } ? 'release' : 'fast'
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '-o', generatedJni.get().asFile, 'build', '--profile', profile, '-p', 'syntra-ui'
    // Every crate the app links, including Slint markup and assets, so a
    // change anywhere triggers a rebuild and nothing else does.
    def workspace = layout.projectDirectory.dir('../../../..')
    inputs.files(fileTree(workspace.dir('crates')) { exclude '**/android/**/build/**', '**/target/**' })
    inputs.files(fileTree(workspace.dir('plugins')))
    inputs.file workspace.file('Cargo.toml')
    inputs.file workspace.file('Cargo.lock')
    outputs.dir generatedJni
}

tasks.named('preBuild') { dependsOn 'buildRustRelease' }
