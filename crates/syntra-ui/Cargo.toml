[package]
name = "syntra-ui"
description = "frontend-neutral presentation state and transport boundary for syntra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.android]
package = "io.syntra.syntra"
# arm64 covers physical devices; x86_64 is what emulators and Waydroid run.
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
apk_name = "syntra"
resources = "android/app/src/main/res"

[package.metadata.android.sdk]

min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Syntra"
theme = "@style/AppTheme"

[package.metadata.android.application.activity]
exported = true

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE"

[lints]
workspace = true

[dependencies]
syntra-api.workspace = true
syntra-store.workspace = true
log = "0.4"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.0"
unic-langid = "0.9"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = { version = "1.0", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
x11rb = "0.13"

[target.'cfg(not(target_os = "android"))'.dependencies]
# Resolves the per-user application directory for the launcher entry.
dirs = "6"
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
rfd = "0.15"

[target.'cfg(unix)'.dependencies]
# SIGINT to an owned daemon, so it releases pressed keys before exiting.
libc.workspace = true
interprocess = { version = "2.4.4", default-features = false }
fs2 = "0.4.3"

[target.'cfg(target_os = "android")'.dependencies]
# `renderer-software` is the fallback for hosts without a usable GL context,
# such as emulators and Waydroid, where Skia cannot create a direct context.
slint = { version = "1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-femtovg", "renderer-software"] }
# `cargo apk` generates a manifest declaring android.app.NativeActivity, so the
# backend must be built for that variant. android-activity defaults to
# GameActivity, which starts the activity but never calls android_main, giving
# a window that opens and closes with no Rust output at all.
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
# Rust logs are invisible on Android without a logcat bridge.
android_logger = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSView", "NSWindow"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.17.1"
toml = "0.8"


