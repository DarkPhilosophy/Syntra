<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="horn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6e4"/>
      <stop offset="1" stop-color="#8fa574"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a1a"/>
      <stop offset="1" stop-color="#0b120a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1dc"/>
      <stop offset="1" stop-color="#c9d3ac"/>
    </linearGradient>
  </defs>
  <!-- horns: sweep up and out, the signature of the mark -->
  <path fill="url(#horn)" d="M47 37C27 35 14 22 19 3 25 17 36 23 54 27Z"/>
  <path fill="url(#horn)" d="M81 37C101 35 114 22 109 3 103 17 92 23 74 27Z"/>
  <!-- hair silhouette, falling to the shoulders -->
  <path fill="url(#hair)" d="M64 27C40 25 25 40 25 62L20 106Q31 115 45 112L64 102 83 112Q97 115 108 106L103 62C103 40 88 25 64 27Z"/>
  <!-- face -->
  <path fill="url(#skin)" d="M44 57 50 48 64 56 78 48 84 57 80 81Q75 94 64 101 53 94 48 81Z"/>
  <!-- fringe, cut into three points -->
  <path fill="#1d2a1a" d="M38 60Q41 35 64 37 87 35 90 60L81 53 72 47 64 61 56 47 47 53Z"/>
  <!-- eyes: the green glow gives the mark its character -->
  <path fill="#a9c980" d="M47 68Q53 63.5 59.5 68.5 53 72 47 68Z"/>
  <path fill="#a9c980" d="M81 68Q75 63.5 68.5 68.5 75 72 81 68Z"/>
  <path fill="none" stroke="#6f7f5a" stroke-width="2" stroke-linecap="round" d="M59.5 88Q64 90.5 68.5 88"/>
  <!-- crest -->
  <path fill="#a9c980" d="M64 17 68.5 24 64 31 59.5 24Z"/>
</svg>
