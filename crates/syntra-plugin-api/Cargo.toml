[package]
name = "syntra-plugin-api"
description = "Versioned external-process adapter protocol for Syntra file clipboard integration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
thiserror = "2.0.0"
base64 = "0.22"
sha2 = "0.10.8"

[dev-dependencies]
tempfile = "3.25"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.148"
