[package]
name = "syntra-app"
description = "Syntra desktop dashboard: a client of the Syntra daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "syntra"
path = "src/main.rs"

# Deliberately no dependency on syntra-core: the dashboard is a client and
# must stay installable without the daemon's capture and emulation stack.
[dependencies]
syntra-api.workspace = true
syntra-log.workspace = true
syntra-ui.workspace = true

log.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[package.metadata.bundle]
name = "Syntra"
identifier = "io.syntra.Syntra"
icon = ["target/icon.icns", "../syntra-ui/ui/assets/shell/syntra.svg"]
osx_info_plist_exts = ["../../build-aux/macos-lsui-element.plist"]
resources = ["target/menubar-template.png"]
