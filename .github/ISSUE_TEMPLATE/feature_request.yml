name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work from a user's point of view.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms concerned
      multiple: true
      options: [Linux, macOS, Windows, Android, iOS, All]
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
