name: "Release"
run-name: "Release - ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.name || github.ref_name }}"

on:
  push:
    branches: [ "main" ]
    tags:
      - v**
  workflow_dispatch:
    inputs:
      name:
        description: 'Development release name'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-release-build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev libfuse3-dev libgtk-4-dev
    - name: Release Build
      run: |
        cargo build --release
        cargo build --release -p syntra-plugin-fuse -p syntra-plugin-gtk-clipboard
        cp target/release/syntra syntra-linux-x86_64
        cp target/release/syntra-plugin-fuse syntra-plugin-fuse-linux-x86_64
        cp target/release/syntra-plugin-gtk-clipboard syntra-plugin-gtk-clipboard-linux-x86_64
        test -x syntra-linux-x86_64
        test -x syntra-plugin-fuse-linux-x86_64
        test -x syntra-plugin-gtk-clipboard-linux-x86_64
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: cargo bundle --release
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: syntra-linux-x86_64
        path: |
          syntra-linux-x86_64
          syntra-plugin-fuse-linux-x86_64
          syntra-plugin-gtk-clipboard-linux-x86_64
          target/release/bundle/deb/syntra_*.deb
          target/release/bundle/appimage/syntra_*.AppImage

  linux-arm64-release-build:
    runs-on: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install libx11-dev libxtst-dev libfuse3-dev libgtk-4-dev
    - name: Release Build
      run: |
        cargo build --release
        cargo build --release -p syntra-plugin-fuse -p syntra-plugin-gtk-clipboard
        cp target/release/syntra syntra-linux-arm64
        cp target/release/syntra-plugin-fuse syntra-plugin-fuse-linux-arm64
        cp target/release/syntra-plugin-gtk-clipboard syntra-plugin-gtk-clipboard-linux-arm64
        test -x syntra-linux-arm64
        test -x syntra-plugin-fuse-linux-arm64
        test -x syntra-plugin-gtk-clipboard-linux-arm64
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: cargo bundle --release
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: syntra-linux-arm64
        path: |
          syntra-linux-arm64
          syntra-plugin-fuse-linux-arm64
          syntra-plugin-gtk-clipboard-linux-arm64
          target/release/bundle/deb/syntra_*.deb
          target/release/bundle/appimage/syntra_*.AppImage

  windows-release-build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Release Build
      run: cargo build --release
    - name: Create Archive
      run: |
        mkdir syntra-windows
        Copy-Item target\release\syntra.exe syntra-windows
        if (!(Test-Path syntra-windows\syntra.exe)) { throw "Missing syntra.exe" }
        Compress-Archive -Path syntra-windows\* -DestinationPath syntra-windows-x86_64.zip
    - uses: actions/upload-artifact@v6
      with:
        name: syntra-windows-x86_64
        path: syntra-windows-x86_64.zip

  macos-release-build:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        brew install --cask inkscape
        brew install imagemagick librsvg
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/syntra syntra-macos-intel
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
        scripts/copy-macos-dylib.sh "target/release/bundle/osx/Syntra.app/Contents/MacOS/syntra"
    - name: Verify bundle
      run: |
        test -f target/icon.icns
        test -x "target/release/bundle/osx/Syntra.app/Contents/MacOS/syntra"
        test -f "target/release/bundle/osx/Syntra.app/Contents/Resources/menubar-template.png"
    - name: Zip bundle
      run: |
        cd target/release/bundle/osx
        zip -r "syntra-macos-intel.zip" "Syntra.app"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: syntra-macos-intel
        path: target/release/bundle/osx/syntra-macos-intel.zip

  macos-arm64-release-build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        brew install --cask inkscape
        brew install imagemagick librsvg
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/syntra syntra-macos-arm64
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release
        scripts/copy-macos-dylib.sh "target/release/bundle/osx/Syntra.app/Contents/MacOS/syntra"
    - name: Verify bundle
      run: |
        test -f target/icon.icns
        test -x "target/release/bundle/osx/Syntra.app/Contents/MacOS/syntra"
        test -f "target/release/bundle/osx/Syntra.app/Contents/Resources/menubar-template.png"
    - name: Zip bundle
      run: |
        cd target/release/bundle/osx
        zip -r "syntra-macos-arm64.zip" "Syntra.app"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: syntra-macos-arm64
        path: target/release/bundle/osx/syntra-macos-arm64.zip

  release:
    name: "Release"
    needs: [windows-release-build, linux-release-build, linux-arm64-release-build, macos-release-build, macos-arm64-release-build]
    runs-on: "ubuntu-latest"
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    - name: Get short SHA
      id: vars
      run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
    - name: Create Pre-Release
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
        name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
        prerelease: true
        generate_release_notes: true
        files: |
          syntra-linux-x86_64/syntra-linux-x86_64
          syntra-linux-x86_64/target/release/bundle/deb/syntra_*.deb
          syntra-linux-x86_64/target/release/bundle/appimage/syntra_*.AppImage
          syntra-linux-arm64/syntra-linux-arm64
          syntra-linux-arm64/target/release/bundle/deb/syntra_*.deb
          syntra-linux-arm64/target/release/bundle/appimage/syntra_*.AppImage
          syntra-macos-intel/syntra-macos-intel.zip
          syntra-macos-arm64/syntra-macos-arm64.zip
          syntra-windows-x86_64/syntra-windows-x86_64.zip
    - name: Create Tagged Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          syntra-linux-x86_64/syntra-linux-x86_64
          syntra-linux-x86_64/target/release/bundle/deb/syntra_*.deb
          syntra-linux-x86_64/target/release/bundle/appimage/syntra_*.AppImage
          syntra-linux-arm64/syntra-linux-arm64
          syntra-linux-arm64/target/release/bundle/deb/syntra_*.deb
          syntra-linux-arm64/target/release/bundle/appimage/syntra_*.AppImage
          syntra-macos-intel/syntra-macos-intel.zip
          syntra-macos-arm64/syntra-macos-arm64.zip
          syntra-windows-x86_64/syntra-windows-x86_64.zip
