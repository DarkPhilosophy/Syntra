name: "Release"
run-name: "Release - ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.name || github.ref_name }}"

# Releases are cut from version tags (or on demand). Building every push to
# main produced a pre-release per commit and a failure notification each
# time something unrelated to packaging broke.
on:
  push:
    tags:
      - v**
  workflow_dispatch:
    inputs:
      name:
        description: 'Development release name'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-release-build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y libx11-dev libxtst-dev libei-dev libxkbcommon-dev libwayland-dev libgtk-4-dev libfuse3-dev pkg-config
    - name: Release Build
      run: |
        cargo build --release --features syntra-daemon/layer_shell_capture,syntra-daemon/x11_capture,syntra-daemon/libei_capture,syntra-daemon/wlroots_emulation,syntra-daemon/libei_emulation,syntra-daemon/rdp_emulation,syntra-daemon/uinput_emulation,syntra-daemon/x11_emulation
        cargo build --release -p syntra-plugin-fuse -p syntra-plugin-clipboard
        cp target/release/syntra syntra-linux-x86_64
        cp target/release/syntra-daemon syntra-daemon-linux-x86_64
        cp target/release/syntra-plugin-fuse syntra-plugin-fuse-linux-x86_64
        cp target/release/syntra-plugin-clipboard syntra-plugin-clipboard-linux-x86_64
        test -x syntra-linux-x86_64
        test -x syntra-daemon-linux-x86_64
        test -x syntra-plugin-fuse-linux-x86_64
        test -x syntra-plugin-clipboard-linux-x86_64
    - name: Install packagers
      run: cargo install cargo-bundle cargo-generate-rpm cargo-deb --locked
    - name: Bundle
      run: |
        cargo bundle --release -p syntra-app
        # Full packages: dashboard, daemon and plugins, desktop entry, icon.
        # They replace cargo-bundle's .deb, which holds the dashboard only.
        rm -f target/release/bundle/deb/*.deb
        cargo deb -p syntra-app --no-build --no-strip -o target/release/bundle/deb/
        mkdir -p target/release/bundle/rpm
        cargo generate-rpm -p crates/syntra-app -o target/release/bundle/rpm
        ls target/release/bundle/*/
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: syntra-linux-x86_64
        path: |
          syntra-linux-x86_64
          syntra-daemon-linux-x86_64
          syntra-plugin-fuse-linux-x86_64
          syntra-plugin-clipboard-linux-x86_64
          target/release/bundle/deb/syntra_*.deb
          target/release/bundle/rpm/syntra-*.rpm
          target/release/bundle/appimage/syntra_*.AppImage

  linux-arm64-release-build:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libx11-dev libxtst-dev libei-dev libxkbcommon-dev libwayland-dev libgtk-4-dev libfuse3-dev pkg-config
    - name: Release Build
      run: |
        cargo build --release --features syntra-daemon/layer_shell_capture,syntra-daemon/x11_capture,syntra-daemon/libei_capture,syntra-daemon/wlroots_emulation,syntra-daemon/libei_emulation,syntra-daemon/rdp_emulation,syntra-daemon/uinput_emulation,syntra-daemon/x11_emulation
        cargo build --release -p syntra-plugin-fuse -p syntra-plugin-clipboard
        cp target/release/syntra syntra-linux-arm64
        cp target/release/syntra-daemon syntra-daemon-linux-arm64
        cp target/release/syntra-plugin-fuse syntra-plugin-fuse-linux-arm64
        cp target/release/syntra-plugin-clipboard syntra-plugin-clipboard-linux-arm64
        test -x syntra-linux-arm64
        test -x syntra-daemon-linux-arm64
        test -x syntra-plugin-fuse-linux-arm64
        test -x syntra-plugin-clipboard-linux-arm64
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: cargo bundle --release -p syntra-app
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: syntra-linux-arm64
        path: |
          syntra-linux-arm64
          syntra-daemon-linux-arm64
          syntra-plugin-fuse-linux-arm64
          syntra-plugin-clipboard-linux-arm64
          target/release/bundle/deb/syntra_*.deb
          target/release/bundle/appimage/syntra_*.AppImage

  windows-release-build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Release Build
      run: cargo build --release
    - name: Create Archive
      run: |
        mkdir syntra-windows
        Copy-Item target\release\syntra.exe syntra-windows
        Copy-Item target\release\syntra-daemon.exe syntra-windows
        if (!(Test-Path syntra-windows\syntra.exe)) { throw "Missing syntra.exe" }
        if (!(Test-Path syntra-windows\syntra-daemon.exe)) { throw "Missing syntra-daemon.exe" }
        Compress-Archive -Path syntra-windows\* -DestinationPath syntra-windows-x86_64.zip
    - name: Build MSI
      run: |
        dotnet tool install --global wix --version 5.0.2
        $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq "syntra-app" | Select-Object -ExpandProperty version
        wix build build-aux/windows/syntra.wxs -d Version=$version -d BinDir=target\release -arch x64 -o syntra-windows-x86_64.msi
        if (!(Test-Path syntra-windows-x86_64.msi)) { throw "Missing MSI" }
    - uses: actions/upload-artifact@v6
      with:
        name: syntra-windows-x86_64
        path: |
          syntra-windows-x86_64.zip
          syntra-windows-x86_64.msi

  flatpak-release-build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
    - uses: actions/checkout@v6
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        # The action names the artifact "<bundle>-<arch>": syntra-x86_64.flatpak/syntra.flatpak
        bundle: syntra.flatpak
        manifest-path: build-aux/io.syntra.Syntra.yml
        cache-key: flatpak-${{ github.sha }}

  android-release-build:
    uses: ./.github/workflows/android.yml

  macos-release-build:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        brew install --cask inkscape
        brew install imagemagick librsvg
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/syntra syntra-macos-intel
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release -p syntra-app
        cp target/release/syntra-daemon "target/release/bundle/osx/Syntra.app/Contents/MacOS/syntra-daemon"
        scripts/copy-macos-dylib.sh "target/release/bundle/osx/Syntra.app/Contents/MacOS/syntra"
    - name: Verify bundle
      run: |
        test -f target/icon.icns
        test -x "target/release/bundle/osx/Syntra.app/Contents/MacOS/syntra"
        test -x "target/release/bundle/osx/Syntra.app/Contents/MacOS/syntra-daemon"
        test -f "target/release/bundle/osx/Syntra.app/Contents/Resources/menubar-template.png"
    - name: Zip bundle
      run: |
        cd target/release/bundle/osx
        zip -r "syntra-macos-intel.zip" "Syntra.app"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: syntra-macos-intel
        path: target/release/bundle/osx/syntra-macos-intel.zip

  macos-arm64-release-build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        brew install --cask inkscape
        brew install imagemagick librsvg
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/syntra syntra-macos-arm64
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      run: |
        cargo bundle --release -p syntra-app
        cp target/release/syntra-daemon "target/release/bundle/osx/Syntra.app/Contents/MacOS/syntra-daemon"
        scripts/copy-macos-dylib.sh "target/release/bundle/osx/Syntra.app/Contents/MacOS/syntra"
    - name: Verify bundle
      run: |
        test -f target/icon.icns
        test -x "target/release/bundle/osx/Syntra.app/Contents/MacOS/syntra"
        test -x "target/release/bundle/osx/Syntra.app/Contents/MacOS/syntra-daemon"
        test -f "target/release/bundle/osx/Syntra.app/Contents/Resources/menubar-template.png"
    - name: Zip bundle
      run: |
        cd target/release/bundle/osx
        zip -r "syntra-macos-arm64.zip" "Syntra.app"
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: syntra-macos-arm64
        path: target/release/bundle/osx/syntra-macos-arm64.zip

  release:
    name: "Release"
    needs: [windows-release-build, linux-release-build, linux-arm64-release-build, macos-release-build, macos-arm64-release-build, flatpak-release-build, android-release-build]
    runs-on: "ubuntu-latest"
    # Creating the release and its tag needs write access to the repository.
    permissions:
      contents: write
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    - name: Get short SHA
      id: vars
      run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
    - name: Create Pre-Release
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
        name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
        prerelease: true
        generate_release_notes: true
        files: |
          syntra-linux-x86_64/syntra-linux-x86_64
          syntra-linux-x86_64/syntra-daemon-linux-x86_64
          syntra-linux-x86_64/syntra-plugin-fuse-linux-x86_64
          syntra-linux-x86_64/syntra-plugin-clipboard-linux-x86_64
          syntra-linux-x86_64/target/release/bundle/deb/syntra_*.deb
          syntra-linux-x86_64/target/release/bundle/appimage/syntra_*.AppImage
          syntra-linux-arm64/syntra-linux-arm64
          syntra-linux-arm64/syntra-daemon-linux-arm64
          syntra-linux-arm64/syntra-plugin-fuse-linux-arm64
          syntra-linux-arm64/syntra-plugin-clipboard-linux-arm64
          syntra-linux-arm64/target/release/bundle/deb/syntra_*.deb
          syntra-linux-arm64/target/release/bundle/appimage/syntra_*.AppImage
          syntra-macos-intel/syntra-macos-intel.zip
          syntra-macos-arm64/syntra-macos-arm64.zip
          syntra-windows-x86_64/syntra-windows-x86_64.zip
          syntra-linux-x86_64/target/release/bundle/rpm/syntra-*.rpm
          syntra-windows-x86_64/syntra-windows-x86_64.msi
          syntra-x86_64.flatpak/syntra.flatpak
          syntra-android-debug/*.apk
    - name: Create Tagged Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          syntra-linux-x86_64/syntra-linux-x86_64
          syntra-linux-x86_64/syntra-daemon-linux-x86_64
          syntra-linux-x86_64/syntra-plugin-fuse-linux-x86_64
          syntra-linux-x86_64/syntra-plugin-clipboard-linux-x86_64
          syntra-linux-x86_64/target/release/bundle/deb/syntra_*.deb
          syntra-linux-x86_64/target/release/bundle/appimage/syntra_*.AppImage
          syntra-linux-arm64/syntra-linux-arm64
          syntra-linux-arm64/syntra-daemon-linux-arm64
          syntra-linux-arm64/syntra-plugin-fuse-linux-arm64
          syntra-linux-arm64/syntra-plugin-clipboard-linux-arm64
          syntra-linux-arm64/target/release/bundle/deb/syntra_*.deb
          syntra-linux-arm64/target/release/bundle/appimage/syntra_*.AppImage
          syntra-macos-intel/syntra-macos-intel.zip
          syntra-macos-arm64/syntra-macos-arm64.zip
          syntra-windows-x86_64/syntra-windows-x86_64.zip
          syntra-linux-x86_64/target/release/bundle/rpm/syntra-*.rpm
          syntra-windows-x86_64/syntra-windows-x86_64.msi
          syntra-x86_64.flatpak/syntra.flatpak
          syntra-android-debug/*.apk
