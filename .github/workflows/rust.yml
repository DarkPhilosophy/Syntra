name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The rules read `cargo metadata`, but `cargo test` still compiles the
      # daemon crate and its capture and emulation dependencies first, so the
      # Linux system libraries are required.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxtst-dev libei-dev libxkbcommon-dev \
            libwayland-dev libgtk-4-dev libfuse3-dev pkg-config
      - name: Verify tier boundaries
        run: cargo test --locked -p syntra-daemon --test architecture

  scripts:
    name: Release and licence scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # The generator tests use only Node's built-in runner.
      - name: Script tests
        run: node --test scripts/test/*.test.js
      # Fails when licenses/THIRD_PARTY_NOTICES.md is stale or a dependency's
      # licence cannot be combined with GPL-3.0-or-later.
      - name: Third-party notices are current
        run: node scripts/sync-licenses.js --check

  ci:
    name: ${{ matrix.job }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - macos-15-intel
        job: [check, test, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.job }}

      # The Linux backends are the only ones needing system libraries; the
      # capture and emulation features below fail to build without them.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxtst-dev libei-dev libxkbcommon-dev \
            libwayland-dev libgtk-4-dev libfuse3-dev pkg-config

      # `--all-features` is wrong here: capture and emulation backends are
      # mutually exclusive per platform, so each OS gets the set it can
      # actually build.
      - name: Select feature set
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "FEATURES=--features syntra-daemon/layer_shell_capture,syntra-daemon/x11_capture,syntra-daemon/libei_capture,syntra-daemon/wlroots_emulation,syntra-daemon/libei_emulation,syntra-daemon/rdp_emulation,syntra-daemon/uinput_emulation,syntra-daemon/x11_emulation" >> "$GITHUB_ENV"
          else
            echo "FEATURES=" >> "$GITHUB_ENV"
          fi

      - name: cargo check
        if: matrix.job == 'check'
        shell: bash
        run: cargo check --locked --workspace --all-targets $FEATURES

      - name: cargo test
        if: matrix.job == 'test'
        shell: bash
        run: cargo test --locked --workspace $FEATURES

      # Ratchet, mirroring the docs job. The dependency-free contract crates
      # are held at zero warnings so the surface plugin authors compile
      # against cannot regress. `-D warnings` propagates to path
      # dependencies, so only crates with no internal deps can be gated this
      # way; the rest still run clippy and report. A blanket `-D warnings`
      # today would only tempt someone into `#[allow]`, which hides the debt
      # rather than paying it.
      - name: cargo clippy (strict, public contract)
        if: matrix.job == 'clippy'
        shell: bash
        run: >-
          cargo clippy --locked --all-targets
          -p syntra-api -p syntra-plugin-api -p syntra-log
          -- -D warnings

      - name: cargo clippy (report)
        if: matrix.job == 'clippy'
        shell: bash
        run: cargo clippy --locked --workspace --all-targets $FEATURES
