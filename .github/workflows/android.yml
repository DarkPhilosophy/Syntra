name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release workflow reuses this build to attach the APK.
  workflow_call:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_API_LEVEL: 35

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/syntra-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package no longer exists in the SDK channel;
          # the default list still asks for it and fails.
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          # Install into the same root the build reads from; the Slint
          # Android backend looks for android.jar under $ANDROID_HOME/platforms.
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          ls "$ANDROID_HOME/platforms"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/syntra-ui/android/.gradle
          key: android-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'crates/syntra-ui/Cargo.toml', 'crates/syntra-ui/android/**/*.gradle') }}
          restore-keys: android-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
        working-directory: .

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          # Named directly so the Slint backend's build script cannot pick
          # a different SDK root than the one populated above.
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-$ANDROID_API_LEVEL/android.jar"
          test -f "$ANDROID_JAR"
          gradle --no-daemon assembleDebug
        working-directory: crates/syntra-ui/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: syntra-android-debug
          path: crates/syntra-ui/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
