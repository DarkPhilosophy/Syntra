name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_API_LEVEL: 35

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lan-mouse-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lan-mouse-ui/target
            lan-mouse-ui/android/.gradle
          key: android-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'lan-mouse-ui/Cargo.toml', 'lan-mouse-ui/android/**/*.gradle') }}
          restore-keys: android-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
        working-directory: .

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          gradle --no-daemon assembleDebug
        working-directory: lan-mouse-ui/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lan-mouse-android-debug
          path: lan-mouse-ui/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
